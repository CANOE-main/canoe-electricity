[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canoe-electricity"
version = "1.0.0"
description = "Electricity sector module for CANOE"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas",
    "pyyaml",
    "requests",
    "lxml",
    "matplotlib",
    "openpyxl",
    "pytz",
    "scipy",
    "xlrd",
    "xmltodict",
    "loguru",
    "canoe_schema @ git+https://github.com/CANOE-main/canoe-schema.git@e8bcbb5aad51bbe04fe0fbd74e02465af2bd3332"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "black"
]

[project.urls]
Repository = "https://github.com/CANOE-main/canoe-electricity"

# NOTE: Version is declared statically in [project].
# Remove Hatch file-based version configuration to avoid ambiguity.
[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
testpaths = ["test"]
